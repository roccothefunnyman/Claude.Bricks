<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hdr-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#003d6b"/>
      <stop offset="60%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#50a0ef"/>
    </linearGradient>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <filter id="sh-sm" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0078d4"/>
    </marker>
    <marker id="arr-grn" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arr-amb" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="#f8f9fa"/>

  <!-- Title bar -->
  <rect width="960" height="52" rx="16" fill="url(#hdr-grad)"/>
  <rect y="36" width="960" height="16" fill="url(#hdr-grad)"/>
  <text x="480" y="34" text-anchor="middle" fill="white" font-size="18" font-weight="700">Why This Exists: From Prompt to LEGO Model</text>

  <!-- ======================== -->
  <!-- THE PROBLEM (top left)   -->
  <!-- ======================== -->
  <rect x="32" y="68" width="290" height="120" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
  <text x="48" y="90" fill="#c2410c" font-size="11" font-weight="600" letter-spacing="0.5">TODAY (WITHOUT MODELS)</text>
  <text x="48" y="112" fill="#1a1a2e" font-size="12" font-weight="600">Claude Code generates buildings</text>
  <text x="48" y="128" fill="#1a1a2e" font-size="12" font-weight="600">from general knowledge alone.</text>
  <text x="48" y="152" fill="#6c757d" font-size="11">No training data about styles,</text>
  <text x="48" y="166" fill="#6c757d" font-size="11">structure, or proven patterns.</text>
  <text x="48" y="180" fill="#c2410c" font-size="11" font-weight="600">It works, but it guesses.</text>

  <!-- Arrow: problem -> solution -->
  <line x1="322" y1="128" x2="358" y2="128" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ======================== -->
  <!-- THE SOLUTION (top right) -->
  <!-- ======================== -->
  <rect x="364" y="68" width="564" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="90" fill="#047857" font-size="11" font-weight="600" letter-spacing="0.5">WITH TRAINED MODELS</text>
  <text x="380" y="112" fill="#1a1a2e" font-size="12" font-weight="600">Four ML models add domain-specific intelligence:</text>
  <text x="380" y="132" fill="#6c757d" font-size="11">&#8226; Structured specs from natural language (not freeform guessing)</text>
  <text x="380" y="148" fill="#6c757d" font-size="11">&#8226; Style classification against real architectural references</text>
  <text x="380" y="164" fill="#6c757d" font-size="11">&#8226; Structural validation before you ever open the file</text>
  <text x="380" y="180" fill="#6c757d" font-size="11">&#8226; Proven construction patterns from training data</text>

  <!-- ======================== -->
  <!-- FLOW DIAGRAM             -->
  <!-- ======================== -->

  <!-- User prompt -->
  <rect x="32" y="224" width="150" height="90" rx="12" fill="white" stroke="#c7ddf5" stroke-width="2" filter="url(#sh)"/>
  <circle cx="66" cy="254" r="16" fill="#0078d4" opacity="0.12"/>
  <text x="66" y="259" text-anchor="middle" fill="#0078d4" font-size="18">&#128172;</text>
  <text x="90" y="254" fill="#1a1a2e" font-size="13" font-weight="700">Your Prompt</text>
  <text x="46" y="275" fill="#6c757d" font-size="10">"2-story Victorian,</text>
  <text x="46" y="288" fill="#6c757d" font-size="10">dark red and tan"</text>

  <!-- Arrow: prompt -> claude code -->
  <line x1="182" y1="269" x2="228" y2="269" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Claude Code (center hub) -->
  <rect x="234" y="210" width="180" height="156" rx="14" fill="#f0f6ff" stroke="#0078d4" stroke-width="3" filter="url(#sh)"/>
  <circle cx="324" cy="244" r="22" fill="#0078d4" opacity="0.15"/>
  <text x="324" y="249" text-anchor="middle" fill="#0078d4" font-size="20" font-weight="700">CC</text>
  <text x="324" y="274" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="700">Claude Code</text>
  <text x="324" y="292" text-anchor="middle" fill="#0078d4" font-size="11" font-weight="600">Orchestrator</text>
  <text x="324" y="312" text-anchor="middle" fill="#6c757d" font-size="10">Writes PowerShell scripts</text>
  <text x="324" y="326" text-anchor="middle" fill="#6c757d" font-size="10">Calls model endpoints</text>
  <text x="324" y="340" text-anchor="middle" fill="#6c757d" font-size="10">Iterates on feedback</text>
  <rect x="248" y="350" width="152" height="12" rx="6" fill="#0078d4" opacity="0.08"/>

  <!-- ======================== -->
  <!-- MODEL ENDPOINTS          -->
  <!-- ======================== -->

  <!-- Arrows from Claude Code to models -->
  <line x1="414" y1="240" x2="488" y2="240" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="414" y1="288" x2="488" y2="288" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="414" y1="310" x2="488" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amb)"/>
  <line x1="414" y1="320" x2="488" y2="392" stroke="#10b981" stroke-width="2" marker-end="url(#arr-grn)"/>

  <!-- Step numbers -->
  <circle cx="452" cy="228" r="11" fill="#ef4444"/>
  <text x="452" y="232" text-anchor="middle" fill="white" font-size="9" font-weight="700">1</text>
  <circle cx="452" cy="276" r="11" fill="#6366f1"/>
  <text x="452" y="280" text-anchor="middle" fill="white" font-size="9" font-weight="700">2</text>
  <circle cx="458" cy="332" r="11" fill="#f59e0b"/>
  <text x="458" y="336" text-anchor="middle" fill="white" font-size="9" font-weight="700">3</text>
  <circle cx="462" cy="386" r="11" fill="#10b981"/>
  <text x="462" y="390" text-anchor="middle" fill="white" font-size="9" font-weight="700">4</text>

  <!-- Scenario 4: Spec Generator -->
  <rect x="494" y="210" width="434" height="56" rx="10" fill="white" stroke="#ef4444" stroke-width="2" filter="url(#sh-sm)"/>
  <rect x="504" y="218" width="68" height="16" rx="8" fill="#ef4444"/>
  <text x="538" y="230" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 4</text>
  <text x="590" y="240" fill="#1a1a2e" font-size="13" font-weight="700">Spec Generator</text>
  <text x="590" y="256" fill="#6c757d" font-size="10">RAG + Azure OpenAI turns your prompt into a structured building spec</text>

  <!-- Scenario 1: Facade Classifier -->
  <rect x="494" y="272" width="434" height="42" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#sh-sm)"/>
  <rect x="504" y="278" width="68" height="16" rx="8" fill="#6366f1"/>
  <text x="538" y="290" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 1</text>
  <text x="590" y="298" fill="#1a1a2e" font-size="13" font-weight="700">Facade Classifier</text>
  <text x="712" y="298" fill="#6c757d" font-size="10">Validates style against architectural references</text>

  <!-- Scenario 2: Structural Validator -->
  <rect x="494" y="320" width="434" height="42" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#sh-sm)"/>
  <rect x="504" y="326" width="68" height="16" rx="8" fill="#f59e0b"/>
  <text x="538" y="338" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 2</text>
  <text x="590" y="346" fill="#1a1a2e" font-size="13" font-weight="700">Structural Validator</text>
  <text x="732" y="346" fill="#6c757d" font-size="10">Flags unstable geometry before you open the file</text>

  <!-- Scenario 3: Pattern Extractor -->
  <rect x="494" y="368" width="434" height="42" rx="10" fill="white" stroke="#10b981" stroke-width="2" filter="url(#sh-sm)"/>
  <rect x="504" y="374" width="68" height="16" rx="8" fill="#10b981"/>
  <text x="538" y="386" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 3</text>
  <text x="590" y="394" fill="#1a1a2e" font-size="13" font-weight="700">Pattern Library</text>
  <text x="700" y="394" fill="#6c757d" font-size="10">Retrieves proven construction patterns from training data</text>

  <!-- ======================== -->
  <!-- OUTPUT                   -->
  <!-- ======================== -->

  <!-- Arrow: Claude Code -> output -->
  <line x1="324" y1="366" x2="324" y2="420" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-grn)"/>

  <!-- Output .ldr -->
  <rect x="234" y="426" width="180" height="60" rx="12" fill="white" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <circle cx="268" cy="456" r="14" fill="#10b981" opacity="0.12"/>
  <text x="268" y="461" text-anchor="middle" fill="#10b981" font-size="14" font-weight="700">.ldr</text>
  <text x="294" y="450" fill="#1a1a2e" font-size="13" font-weight="700">Output File</text>
  <text x="294" y="468" fill="#6c757d" font-size="10">Open in BrickLink Studio</text>

  <!-- Feedback loop -->
  <path d="M 494 390 C 470 430, 440 456, 414 456" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-grn)"/>
  <text x="470" y="448" fill="#10b981" font-size="9" font-style="italic">fix and regenerate</text>

  <!-- Arrow: output -> studio -->
  <line x1="414" y1="456" x2="488" y2="456" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- BrickLink Studio -->
  <rect x="494" y="430" width="180" height="52" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" filter="url(#sh-sm)"/>
  <text x="584" y="454" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="700">BrickLink Studio</text>
  <text x="584" y="470" text-anchor="middle" fill="#6c757d" font-size="10">View, render, refine</text>

  <!-- DP-100 badge -->
  <rect x="720" y="434" width="208" height="48" rx="10" fill="#f0f6ff" stroke="#c7ddf5" filter="url(#sh-sm)"/>
  <circle cx="744" cy="458" r="12" fill="#0078d4" opacity="0.15"/>
  <text x="744" y="463" text-anchor="middle" fill="#0078d4" font-size="12" font-weight="700">&#127891;</text>
  <text x="764" y="453" fill="#1a1a2e" font-size="11" font-weight="600">DP-100 Exam Study</text>
  <text x="764" y="468" fill="#6c757d" font-size="10">Every domain covered in one project</text>

  <!-- Footer -->
  <text x="480" y="510" text-anchor="middle" fill="#6c757d" font-size="10" font-style="italic">Claude Code stays as the orchestrator. Models deploy as Azure ML managed endpoints, called via HTTP. No separate frontend needed.</text>
</svg>