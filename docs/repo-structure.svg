  <rect x="48" y="230" width="196" height="50" rx="6" fill="#f5f0ff" stroke="#c4b5fd" filter="url(#sh-sm)"/>
  <rect x="56" y="236" width="20" height="22" rx="3" fill="#7b42bc" opacity="0.15"/>
  <text x="66" y="251" text-anchor="middle" fill="#7b42bc" font-size="12" font-weight="700">&#128193;</text>
  <text x="84" y="250" fill="#1a1a2e" font-size="12" font-weight="700">scripts/</text>
  <text x="84" y="268" fill="#6c757d" font-size="9">PowerShell .ps1 generators</text>

