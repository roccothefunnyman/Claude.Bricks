<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="60%" stop-color="#2c5f8a"/>
      <stop offset="100%" stop-color="#4a90c4"/>
    </linearGradient>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <filter id="sh-sm" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="#f8f9fa"/>

  <!-- Title bar -->
  <rect width="960" height="52" rx="16" fill="url(#hdr)"/>
  <rect y="36" width="960" height="16" fill="url(#hdr)"/>
  <text x="480" y="34" text-anchor="middle" fill="white" font-size="18" font-weight="700">Repository Structure</text>

  <!-- Left column: LEGO Design side -->
  <rect x="32" y="68" width="440" height="392" rx="12" fill="white" stroke="#e74c3c" stroke-width="2" filter="url(#sh)"/>
  <rect x="32" y="68" width="440" height="30" rx="12" fill="#e74c3c" opacity="0.08"/>
  <rect x="32" y="86" width="440" height="12" fill="white"/>
  <text x="52" y="88" fill="#e74c3c" font-size="11" font-weight="600" letter-spacing="0.5">LEGO DESIGN</text>

  <!-- CLAUDE.md -->
  <rect x="48" y="108" width="408" height="34" rx="6" fill="#f0f6ff" stroke="#c7ddf5" filter="url(#sh-sm)"/>
  <rect x="56" y="114" width="20" height="22" rx="3" fill="#0078d4" opacity="0.15"/>
  <text x="66" y="129" text-anchor="middle" fill="#0078d4" font-size="10" font-weight="700">MD</text>
  <text x="84" y="124" fill="#1a1a2e" font-size="12" font-weight="700">CLAUDE.md</text>
  <text x="240" y="124" fill="#6c757d" font-size="10">Session context, part catalog, build recipes</text>

  <!-- standards/ -->
  <rect x="48" y="150" width="408" height="72" rx="6" fill="#fef3c7" stroke="#fcd34d" filter="url(#sh-sm)"/>
  <rect x="56" y="156" width="20" height="22" rx="3" fill="#f59e0b" opacity="0.2"/>
  <text x="66" y="171" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">&#128193;</text>
  <text x="84" y="170" fill="#1a1a2e" font-size="12" font-weight="700">standards/</text>
  <text x="240" y="170" fill="#6c757d" font-size="10">LDraw conventions &amp; references</text>
  <text x="68" y="190" fill="#6c757d" font-size="9">ldraw-format.md</text>
  <text x="170" y="190" fill="#6c757d" font-size="9">parts-catalog.md</text>
  <text x="280" y="190" fill="#6c757d" font-size="9">color-palette.md</text>
  <text x="68" y="206" fill="#6c757d" font-size="9">modular-building-spec.md</text>
  <text x="220" y="206" fill="#6c757d" font-size="9">architectural-patterns.md</text>

