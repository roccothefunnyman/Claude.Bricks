  <rect x="48" y="288" width="196" height="50" rx="6" fill="#f0f6ff" stroke="#c7ddf5" filter="url(#sh-sm)"/>
  <rect x="56" y="294" width="20" height="22" rx="3" fill="#0078d4" opacity="0.15"/>
  <text x="66" y="309" text-anchor="middle" fill="#0078d4" font-size="12" font-weight="700">&#128193;</text>
  <text x="84" y="308" fill="#1a1a2e" font-size="12" font-weight="700">modules/</text>
  <text x="84" y="326" fill="#6c757d" font-size="9">Shared LDraw.psm1 module</text>

  <!-- reference/ -->
  <rect x="260" y="288" width="196" height="50" rx="6" fill="#fff7ed" stroke="#fdba74" filter="url(#sh-sm)"/>
  <rect x="268" y="294" width="20" height="22" rx="3" fill="#f59e0b" opacity="0.15"/>
  <text x="278" y="309" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">&#128193;</text>
  <text x="296" y="308" fill="#1a1a2e" font-size="12" font-weight="700">reference/</text>
  <text x="296" y="326" fill="#6c757d" font-size="9">Reference .ldr files for analysis</text>

  <!-- Flow arrows between scripts -> output -->
  <line x1="244" y1="255" x2="260" y2="255" stroke="#7b42bc" stroke-width="1.5" opacity="0.4"/>
  <polygon points="257,251 263,255 257,259" fill="#10b981" opacity="0.5"/>

  <!-- Right column: Azure ML side -->
  <rect x="488" y="68" width="440" height="392" rx="12" fill="white" stroke="#0078d4" stroke-width="2" filter="url(#sh)"/>
  <rect x="488" y="68" width="440" height="30" rx="12" fill="#0078d4" opacity="0.08"/>
  <rect x="488" y="86" width="440" height="12" fill="white"/>
  <text x="508" y="88" fill="#0078d4" font-size="11" font-weight="600" letter-spacing="0.5">AZURE ML INFRASTRUCTURE</text>

