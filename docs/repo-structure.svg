  <rect x="520" y="142" width="180" height="30" rx="4" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="536" y="160" fill="#7b42bc" font-size="10" font-weight="600">infrastructure/</text>
  <text x="630" y="160" fill="#6c757d" font-size="9">Terraform configs</text>

  <rect x="520" y="176" width="180" height="30" rx="4" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="536" y="194" fill="#10b981" font-size="10" font-weight="600">bootstrap/</text>
  <text x="614" y="194" fill="#6c757d" font-size="9">Post-TF setup (SDK v2)</text>

  <rect x="712" y="142" width="188" height="30" rx="4" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="728" y="160" fill="#ef4444" font-size="10" font-weight="600">scenarios/</text>
  <text x="808" y="160" fill="#6c757d" font-size="9">ML scenarios 1-4</text>

  <rect x="712" y="176" width="188" height="30" rx="4" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="728" y="194" fill="#f59e0b" font-size="10" font-weight="600">data/</text>
  <text x="770" y="194" fill="#6c757d" font-size="9">Training data per scenario</text>

  <!-- docs/ -->
  <rect x="504" y="230" width="408" height="50" rx="6" fill="#ecfdf5" stroke="#6ee7b7" filter="url(#sh-sm)"/>
  <rect x="512" y="236" width="20" height="22" rx="3" fill="#10b981" opacity="0.15"/>
  <text x="522" y="251" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700">&#128193;</text>
  <text x="540" y="250" fill="#1a1a2e" font-size="12" font-weight="700">docs/</text>
  <text x="586" y="250" fill="#6c757d" font-size="10">GitHub Pages: As-Built document + SVG diagrams</text>
  <text x="540" y="268" fill="#6c757d" font-size="9">index.html</text>
  <text x="606" y="268" fill="#6c757d" font-size="9">resource-map.svg</text>
  <text x="720" y="268" fill="#6c757d" font-size="9">integration-flow.svg</text>

  <!-- azure-icons/ -->
  <rect x="504" y="288" width="196" height="50" rx="6" fill="#fef3c7" stroke="#fcd34d" filter="url(#sh-sm)"/>
  <rect x="512" y="294" width="20" height="22" rx="3" fill="#f59e0b" opacity="0.15"/>
  <text x="522" y="309" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">&#128193;</text>
  <text x="540" y="308" fill="#1a1a2e" font-size="12" font-weight="700">azure-icons/</text>
  <text x="540" y="326" fill="#6c757d" font-size="9">Official Azure SVG icons</text>

  <!-- Root files row -->
  <rect x="48" y="350" width="130" height="40" rx="6" fill="#f8f9fa" stroke="#e0e0e0" filter="url(#sh-sm)"/>
  <text x="62" y="370" fill="#0078d4" font-size="10" font-weight="600">README.md</text>
  <text x="62" y="382" fill="#6c757d" font-size="8">This file</text>

  <rect x="504" y="350" width="196" height="40" rx="6" fill="#f8f9fa" stroke="#e0e0e0" filter="url(#sh-sm)"/>
  <text x="518" y="370" fill="#0078d4" font-size="10" font-weight="600">claude-bricks-asbuilt.html</text>
  <text x="518" y="382" fill="#6c757d" font-size="8">Full as-built documentation source</text>

  <!-- Connection label -->
  <rect x="360" y="395" width="240" height="38" rx="8" fill="#f0f6ff" stroke="#0078d4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="412" text-anchor="middle" fill="#0078d4" font-size="10" font-weight="600">LEGO design scripts consume</text>
  <text x="480" y="424" text-anchor="middle" fill="#0078d4" font-size="10" font-weight="600">ML model endpoints from Azure</text>

  <!-- Connection lines -->
  <line x1="380" y1="340" x2="380" y2="395" stroke="#0078d4" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <line x1="580" y1="340" x2="580" y2="395" stroke="#0078d4" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Footer -->
  <text x="480" y="470" text-anchor="middle" fill="#6c757d" font-size="10" font-style="italic">Two halves of one project: LEGO design tools on the left, Azure ML infrastructure on the right.</text>
</svg>