<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#003d6b"/>
      <stop offset="60%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#50a0ef"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="16" fill="#f8f9fa"/>

  <!-- Title bar -->
  <rect width="960" height="56" rx="16" fill="url(#header-grad)"/>
  <rect y="40" width="960" height="16" fill="url(#header-grad)"/>
  <text x="480" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700">Claude.Bricks - Complete Resource Map</text>

  <!-- Resource Group boundary -->
  <rect x="24" y="72" width="912" height="534" rx="14" fill="none" stroke="#0078d4" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- RG Label -->
  <rect x="40" y="62" width="280" height="22" rx="4" fill="#f8f9fa"/>
  <circle cx="56" cy="73" r="8" fill="#50e6ff" opacity="0.3"/>
  <rect cx="52" cy="69" width="8" height="8" rx="1" fill="#0078d4" x="52" y="69"/>
  <text x="70" y="77" fill="#0078d4" font-size="13" font-weight="600">rg-claudebricks-dev (East US)</text>

  <!-- ==================== -->
  <!-- CORE PLATFORM SERVICES -->
  <!-- ==================== -->
  <rect x="40" y="96" width="880" height="130" rx="10" fill="#fafcff" stroke="#e0e0e0" filter="url(#shadow-sm)"/>
  <text x="56" y="116" fill="#6c757d" font-size="11" font-weight="600" letter-spacing="0.5">CORE PLATFORM SERVICES</text>

  <!-- ML Workspace -->
  <rect x="56" y="126" width="130" height="84" rx="8" fill="#f0f6ff" stroke="#c7ddf5"/>
  <circle cx="80" cy="154" r="14" fill="#0078d4" opacity="0.15"/>
  <text x="80" y="158" text-anchor="middle" fill="#0078d4" font-size="16" font-weight="700">ML</text>
  <text x="100" y="150" fill="#1a1a2e" font-size="12" font-weight="700">ML Workspace</text>
  <text x="100" y="165" fill="#6c757d" font-size="10">Central ML hub</text>
  <rect x="60" y="176" width="120" height="16" rx="3" fill="#0078d4" opacity="0.1"/>
  <text x="120" y="188" text-anchor="middle" fill="#0078d4" font-size="9" font-weight="600">HUB</text>

  <!-- Storage Account -->
  <rect x="200" y="126" width="130" height="84" rx="8" fill="#f0f6ff" stroke="#c7ddf5"/>
  <circle cx="224" cy="154" r="14" fill="#37c2b1" opacity="0.15"/>
  <rect x="216" y="146" width="16" height="16" rx="2" fill="#37c2b1"/>
  <text x="244" y="150" fill="#1a1a2e" font-size="12" font-weight="700">Storage</text>
  <text x="244" y="165" fill="#6c757d" font-size="10">Data, artifacts,</text>
  <text x="244" y="177" fill="#6c757d" font-size="10">models</text>

  <!-- Key Vault -->
  <rect x="344" y="126" width="130" height="84" rx="8" fill="#f0f6ff" stroke="#c7ddf5"/>
  <circle cx="368" cy="154" r="14" fill="#ffd70f" opacity="0.2"/>
  <text x="368" y="158" text-anchor="middle" fill="#c89200" font-size="14">&#128273;</text>
  <text x="388" y="150" fill="#1a1a2e" font-size="12" font-weight="700">Key Vault</text>
  <text x="388" y="165" fill="#6c757d" font-size="10">Secrets &amp; keys</text>

  <!-- Container Registry -->
  <rect x="488" y="126" width="130" height="84" rx="8" fill="#f0f6ff" stroke="#c7ddf5"/>
  <circle cx="512" cy="154" r="14" fill="#0078d4" opacity="0.12"/>
  <rect x="504" y="146" width="16" height="16" rx="8" fill="#0078d4" opacity="0.4"/>
