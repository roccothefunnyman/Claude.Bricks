  <!-- AI & COGNITIVE SERVICES -->
  <!-- ==================== -->
  <rect x="40" y="358" width="880" height="110" rx="10" fill="#fafcff" stroke="#e0e0e0" filter="url(#shadow-sm)"/>
  <text x="56" y="378" fill="#6c757d" font-size="11" font-weight="600" letter-spacing="0.5">AI &amp; COGNITIVE SERVICES</text>

