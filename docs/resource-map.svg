  <rect x="56" y="512" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="68" y="524" width="14" height="18" rx="2" fill="#10b981" opacity="0.3"/>
  <rect x="70" y="526" width="10" height="5" rx="1" fill="#10b981" opacity="0.5"/>
  <text x="90" y="536" fill="#1a1a2e" font-size="12" font-weight="700">facade-images</text>
  <rect x="90" y="542" width="68" height="14" rx="7" fill="#6366f1"/>
  <text x="124" y="552" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 1</text>

  <!-- ldr-files -->
  <rect x="270" y="512" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="282" y="524" width="14" height="18" rx="2" fill="#10b981" opacity="0.3"/>
  <rect x="284" y="526" width="10" height="5" rx="1" fill="#10b981" opacity="0.5"/>
  <text x="304" y="536" fill="#1a1a2e" font-size="12" font-weight="700">ldr-files</text>
  <rect x="304" y="542" width="68" height="14" rx="7" fill="#f59e0b"/>
  <text x="338" y="552" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 2</text>

  <!-- reference-models -->
  <rect x="484" y="512" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="496" y="524" width="14" height="18" rx="2" fill="#10b981" opacity="0.3"/>
  <rect x="498" y="526" width="10" height="5" rx="1" fill="#10b981" opacity="0.5"/>
  <text x="518" y="536" fill="#1a1a2e" font-size="12" font-weight="700">reference-models</text>
  <rect x="518" y="542" width="68" height="14" rx="7" fill="#10b981"/>
  <text x="552" y="552" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 3</text>

  <!-- training-data -->
  <rect x="698" y="512" width="208" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="710" y="524" width="14" height="18" rx="2" fill="#10b981" opacity="0.3"/>
  <rect x="712" y="526" width="10" height="5" rx="1" fill="#10b981" opacity="0.5"/>
  <text x="732" y="536" fill="#1a1a2e" font-size="12" font-weight="700">training-data</text>
  <rect x="732" y="542" width="68" height="14" rx="7" fill="#ef4444"/>
  <text x="766" y="552" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 4</text>

  <!-- Footer caption -->
  <text x="480" y="604" text-anchor="middle" fill="#6c757d" font-size="11" font-style="italic">All resources deployed into a single Resource Group via Terraform. ML Workspace connects to Storage, Key Vault, ACR, and App Insights as linked services.</text>
</svg>