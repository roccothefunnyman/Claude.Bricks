  <circle cx="800" cy="154" r="14" fill="#198ab3" opacity="0.15"/>
  <rect x="793" y="148" width="14" height="3" rx="1" fill="#198ab3"/>
  <rect x="793" y="153" width="14" height="3" rx="1" fill="#32d4f5"/>
