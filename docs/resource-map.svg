  <text x="670" y="293" fill="#1a1a2e" font-size="12" font-weight="700">GPU Cluster</text>
  <text x="670" y="308" fill="#6c757d" font-size="10">NC4as_T4_v3 - 0-2 nodes, Low Priority - S1, S4</text>

