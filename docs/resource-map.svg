  <text x="386" y="293" fill="#1a1a2e" font-size="12" font-weight="700">CPU Cluster</text>
  <text x="386" y="308" fill="#6c757d" font-size="10">DS3_v2 - 0-4 nodes, Low Priority - S1-S3</text>

  <!-- GPU Cluster -->
  <rect x="624" y="268" width="282" height="64" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <circle cx="648" cy="300" r="14" fill="#f59e0b" opacity="0.15"/>
  <rect x="640" y="294" width="7" height="12" rx="1" fill="#f59e0b" opacity="0.6"/>
