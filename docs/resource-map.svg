  <text x="102" y="415" fill="#1a1a2e" font-size="12" font-weight="700">Custom Vision</text>
  <text x="102" y="430" fill="#6c757d" font-size="10">Training + Prediction</text>
  <rect x="102" y="436" width="68" height="14" rx="7" fill="#6366f1"/>
  <text x="136" y="446" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 1</text>

  <!-- Azure OpenAI -->
  <rect x="340" y="390" width="270" height="64" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <circle cx="364" cy="422" r="14" fill="#0078d4" opacity="0.12"/>
  <text x="364" y="427" text-anchor="middle" fill="#0078d4" font-size="16" font-weight="700">&#10040;</text>
  <text x="386" y="415" fill="#1a1a2e" font-size="12" font-weight="700">Azure OpenAI</text>
  <text x="386" y="430" fill="#6c757d" font-size="10">gpt-4o-mini deployment</text>
  <rect x="386" y="436" width="68" height="14" rx="7" fill="#ef4444"/>
  <text x="420" y="446" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 4</text>

  <!-- AI Search -->
  <rect x="624" y="390" width="282" height="64" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <circle cx="648" cy="422" r="14" fill="#0078d4" opacity="0.12"/>
  <text x="648" y="427" text-anchor="middle" fill="#0078d4" font-size="14" font-weight="700">&#128269;</text>
  <text x="670" y="415" fill="#1a1a2e" font-size="12" font-weight="700">AI Search</text>
  <text x="670" y="430" fill="#6c757d" font-size="10">Vector store (RAG)</text>
  <rect x="670" y="436" width="68" height="14" rx="7" fill="#ef4444"/>
  <text x="704" y="446" text-anchor="middle" fill="white" font-size="8" font-weight="600">SCENARIO 4</text>

